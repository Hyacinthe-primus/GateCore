[package]
name = "gatecore-cli"
version = "2.0.1"
edition = "2021"
rust-version = "1.90"
description = "Management CLI for the ESP32-S3 GateCore firmware (serial, hybrid JSON + binary protocol)"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/Hyacinthe-primus/GateCore"
default-run = "gatecore-cli"

[[bin]]
name = "gatecore-cli"
path = "src/main.rs"

[lib]
name = "gatecore_cli"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
colored = "2"
comfy-table = "7"
crc32fast = "1.4"
csv = "1.3"
ctrlc = "3.4"
dirs = "5"
indicatif = "0.17"
rpassword = "7"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serialport = "4.6"
shlex = "1.3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
