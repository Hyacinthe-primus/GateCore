name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  # Same options as firmware/uploader.ps1 and firmware/uploader.sh.
  FQBN: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=custom

jobs:
  compile:
    name: compile (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache the ESP32 core and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('.github/workflows/firmware.yml') }}

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit PN532" "LiquidCrystal I2C" "ArduinoJson@7.2.1"

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir "$RUNNER_TEMP/out" firmware/firmware.ino

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: ${{ runner.temp }}/out/*.bin
          retention-days: 14
