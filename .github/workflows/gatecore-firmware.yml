name: gatecore-firmware

on:
  push:
    paths: ["gatecore-firmware/**", ".github/workflows/gatecore-firmware.yml"]
  pull_request:
    paths: ["gatecore-firmware/**", ".github/workflows/gatecore-firmware.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gatecore-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  ESP32_INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  # Same options as gatecore-firmware/uploader.ps1 and gatecore-firmware/uploader.sh.
  FQBN: esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=custom

jobs:
  compile:
    name: compile (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install arduino-cli
        env:
          ARDUINO_CLI_VERSION: 1.5.1
        run: |
          curl -fsSL "https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz" -o /tmp/arduino-cli.tar.gz
          sudo tar -xzf /tmp/arduino-cli.tar.gz -C /usr/local/bin arduino-cli
          arduino-cli version

      - name: Cache the ESP32 core and libraries
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('.github/workflows/gatecore-firmware.yml') }}

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit PN532" "LiquidCrystal I2C" "ArduinoJson@7.2.1"

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir "$RUNNER_TEMP/out" gatecore-firmware/gatecore-firmware.ino

      - uses: actions/upload-artifact@v7
        with:
          name: gatecore-firmware-esp32s3
          path: ${{ runner.temp }}/out/*.bin
          retention-days: 14
